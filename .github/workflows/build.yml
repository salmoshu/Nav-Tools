name: Build

# 仅在打 tag 时构建，普通提交不触发
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60  # 增加整体作业超时时间
    
    strategy:
      matrix:
        # 先不构建macos应用
        # os: [macos-latest, ubuntu-latest, windows-latest]
        # windows 固定 2022：windows-latest(2025 镜像) 的 VS2026 无法被
        # node-gyp@9 (@electron/rebuild 依赖) 识别，导致 serialport 原生模块编译失败
        os: [ubuntu-latest, windows-2022]
      fail-fast: false  # 避免一个平台失败影响其他平台

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        timeout-minutes: 10  # 单独设置checkout超时
        with:
          fetch-depth: 1

      # node-gyp@9 (@electron/rebuild 依赖) 自带的 gyp 依赖 distutils，
      # Python 3.12+ 已移除该模块，所有平台统一固定 3.11
      - name: Use Python 3.11 for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        timeout-minutes: 5  # 单独设置node设置超时
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15  # 设置依赖安装超时

      # 缓存 Electron 二进制与 electron-builder 下载的工具链(含 Windows 本地缓存目录),
      # 避免构建期访问 GitHub Releases 资源(objects.githubusercontent.com 偶发 403/502)
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      # 构建产物但不发布:发布由 release.yml 负责
      # 不用 pnpm run build -- --publish never:pnpm 在 ubuntu 下会把 `--` 原样拼进
      # 脚本尾部(electron-builder -- --publish never),参数被当作位置参数忽略,
      # 导致 electron-builder 因检测到 tag 仍尝试发布并报 GH_TOKEN 缺失。
      # 不注入 GITHUB_TOKEN:electron-builder 会拿它去请求其他仓库(electron/electron)的
      # API,触发限流型 createHttpError;构建期唯一外网请求(Electron zip)走 npmmirror 镜像
      - name: Build Release Files
        run: pnpm run build:dir && pnpm exec electron-builder --publish never
        timeout-minutes: 30  # 设置构建超时
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v4
        if: always()
        with:
          name: release_on_${{ matrix.os }}
          failOnError: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_on_${{ matrix.os }}
          path: |
            release/*
            !release/**/*.map
            !release/**/*.d.ts
            !release/**/LICENSE*
            !release/**/*.md
          retention-days: 1  # 减少保留天数到1天
          compression-level: 9  # 使用最大压缩
          if-no-files-found: ignore  # 如果没有文件就跳过上传